<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JARVIS</title>
<style>
  html,body{margin:0;height:100%;background:#05080d;color:#9fd8ff;font:14px ui-monospace,monospace;overflow:hidden}
  canvas{position:fixed;inset:0;width:100%;height:100%}
  #hud{position:fixed;left:0;right:0;bottom:6vh;text-align:center;padding:0 5vw}
  #state{letter-spacing:.3em;text-transform:uppercase;opacity:.6;font-size:12px}
  #line{margin-top:10px;min-height:2.6em;font-size:16px;color:#d8f1ff}
  #err{color:#ff8a80;margin-top:6px}
  form{margin-top:14px}input{background:#0b1522;border:1px solid #1d3a56;color:#d8f1ff;padding:8px 12px;width:min(480px,80vw);border-radius:6px}
  a{position:fixed;top:12px;right:16px;color:#5ca7d6}
  #start{position:fixed;inset:0;display:grid;place-items:center;background:#05080dcc;cursor:pointer;font-size:18px;letter-spacing:.2em}
</style></head>
<body><canvas id="orb"></canvas><a href="/dashboard">dashboard</a>
<div id="start">CLICK TO ENABLE AUDIO</div>
<div id="hud"><div id="state">idle</div><div id="line"></div><div id="err"></div>
<form id="f"><input id="t" placeholder="or type to JARVIS" autocomplete="off"></form></div>
<script type="module" src="/src/main.ts"></script></body></html>
